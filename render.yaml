# Render blueprint — backend for DocuCheck.

services:
  - type: web
    name: docucheck-backend
    runtime: node
    rootDir: backend
    branch: prod
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false

      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite

      - key: SANDBOX_API_KEY
        sync: false
      - key: SANDBOX_API_SECRET
        sync: false

      - key: AADHAAR_DEV_OTP
        value: "121212"

      - key: STYTCH_PROJECT_ID
        sync: false
      - key: STYTCH_SECRET
        sync: false
      - key: STYTCH_ENV
        value: test

      - key: CORS_ORIGINS
        value: https://docucheckv2.pages.dev
