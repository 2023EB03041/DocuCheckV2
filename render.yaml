# Render blueprint — native Node (no container) backend for DocuCheck.
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo/prod branch.
# Set MONGO_URI and JWT_SECRET in the dashboard (they are marked sync:false).
services:
  - type: web
    name: docucheck-backend
    runtime: node
    rootDir: backend
    branch: prod
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      # Document reading. The key is set in the dashboard, never in the repo.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      # Record verification. Test credentials only — a live key is refused.
      - key: SANDBOX_API_KEY
        sync: false
      - key: SANDBOX_API_SECRET
        sync: false
      # Password the published sample records are issued with, so a check needs
      # nothing from the guest.
      - key: AADHAAR_DEV_OTP
        value: "121212"
      - key: REQUIRE_GOVERNMENT_VERIFICATION
        value: "true"
      # Stytch, which emails and checks the guest's verification code.
      # Credentials are set in the dashboard, never in the repo.
      - key: STYTCH_PROJECT_ID
        sync: false
      - key: STYTCH_SECRET
        sync: false
      - key: STYTCH_ENV
        value: test
      # Sites a browser may call this API from. Comma separated; add preview
      # deployment URLs here if they need to reach the API.
      - key: CORS_ORIGINS
        value: https://docucheckv2.pages.dev
