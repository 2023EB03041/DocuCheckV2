services:
  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-5001}:5000"
    env_file:
      - ./backend/.env
    restart: always

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-9090}:80"
    depends_on:
      - backend
    restart: always
